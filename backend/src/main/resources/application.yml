server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ambulance-transfer
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ambulance_transfer;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true;loginTimeout=5}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 10
      connection-timeout: 6000
      validation-timeout: 3000
  sql:
    init:
      mode: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  mock-orders:
    enabled: ${MOCK_ORDERS_ENABLED:false}
  auth:
    jwt-secret: ${JWT_SECRET:}
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
